# Configuration file

general {
    # Default sort order for armor materials: true for ascending, false for descending
    B:DefaultArmorAscending=true

    # Default sorting mode for armor materials (DEFAULT, NAME, ARMOR_DEFENSE, ARMOR_TOUGHNESS, ARMOR_DURABILITY, PLATES_DURABILITY, PLATES_MODIFIER, TRIM_EXTRA_DURABILITY)
    S:DefaultArmorSortMode=TRIM_EXTRA_DURABILITY

    # Default sort order for tool materials: true for ascending (A-Z / low to high), false for descending (Z-A / high to low)
    B:DefaultAscending=false

    # Default sort order for bow materials / limbs: true for ascending, false for descending
    B:DefaultBowAscending=true

    # Default sorting mode for bow materials / limbs (DEFAULT, NAME, DURABILITY, DRAW_SPEED, RANGE, BONUS_DAMAGE)
    S:DefaultBowSortMode=DEFAULT

    # Default sort order for bowstring materials: true for ascending, false for descending
    B:DefaultBowstringAscending=true

    # Default sorting mode for bowstring materials (DEFAULT, NAME, BOWSTRING_MODIFIER)
    S:DefaultBowstringSortMode=DEFAULT

    # Default sort order for fletching materials: true for ascending, false for descending
    B:DefaultFletchingAscending=true

    # Default sorting mode for fletching materials (DEFAULT, NAME, ACCURACY, FLETCHING_MODIFIER)
    S:DefaultFletchingSortMode=DEFAULT

    # Default sort order for arrow shaft materials: true for ascending, false for descending
    B:DefaultShaftAscending=true

    # Default sorting mode for arrow shaft materials (DEFAULT, NAME, BONUS_AMMO, SHAFT_MODIFIER)
    S:DefaultShaftSortMode=DEFAULT

    # Default sorting mode for tool materials (DEFAULT, NAME, HARVEST_LEVEL, DURABILITY, MINING_SPEED, ATTACK_DAMAGE, HANDLE_MODIFIER)
    S:DefaultSortMode=ATTACK_DAMAGE

    # Whether to enable the real-time search bar in the book
    B:EnableSearch=true

    # Whether to remember the last used sort mode and order across sessions
    B:RememberLastSort=true

    # Vertical offset of the sorting toolbar relative to the book top (in GUI pixels)
    I:ToolbarYOffset=-22
}


