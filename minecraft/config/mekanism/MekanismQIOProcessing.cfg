# Configuration file

automation {
    # Maximum amount one automatic output device may extract or deliver per server tick.
    S:automaticOutputTransferLimit=1024
}


claims {
    # Maximum material claims refreshed by storage events on one server tick.
    I:claimRefreshesPerTick=32
}


devices {
    # Maximum online and offline QIO automation device records retained by one frequency.
    I:recordsPerFrequency=65536
}


maintenance {
    # Server-wide maximum amount requested by one maintenance order.
    S:batchCap=1000000

    # Ticks between complete inventory-maintenance evaluation passes.
    I:evaluationInterval=100

    # Maximum resource rule groups evaluated per server tick.
    I:groupsPerTick=16

    # Maximum inventory-maintenance rules stored by one QIO frequency.
    I:rulesPerFrequency=4096
}


planning {
    # Maximum completed planning results committed on one server tick.
    I:planningResultsPerTick=32

    # Milliseconds shared by all active QIO planning calculations on one server tick.
    I:planningTimePerTick=5

    # Lifetime of an unlocked QIO plan preview before confirmation is rejected.
    I:previewTimeoutTicks=1200

    # Maximum simultaneous QIO plan previews owned by one player.
    I:previewsPerPlayer=8
}


processors {
    # Maximum logical lane count accepted from a processor definition. Uses a signed long.
    S:processorLaneLimit=9223372036854775807
}


providers {
    # Maximum stable provider recipe routes retained by one QIO frequency.
    I:routesPerFrequency=65536
}


scheduling {
    # Maximum QIO job transfer or dispatch actions committed per server tick.
    I:executionActionsPerTick=128

    # Maximum active QIO processing orders per frequency.
    I:executionSlotsPerFrequency=64

    # Whether one QIO job has an explicit machine-thread limit. When disabled, all eligible online machine lanes may be used.
    B:limitMachineThreadsPerJob=false

    # Whether one QIO job has an explicit workbench-thread limit. When disabled, all eligible online workbench processor lanes may be used.
    B:limitWorkbenchThreadsPerJob=false

    # Maximum machine lanes used concurrently by one QIO job when its limit is enabled.
    I:maxMachineThreadsPerJob=8

    # Maximum workbench processor lanes used concurrently by one QIO job when its limit is enabled.
    I:maxWorkbenchThreadsPerJob=8

    # Maximum queued or active QIO processing jobs retained by one frequency.
    I:nonTerminalJobsPerFrequency=1024

    # Maximum execution slots granted by one frequency per server tick.
    I:slotGrantsPerTick=8
}


terminals {
    # Maximum number of records returned by one QIO Processing terminal page.
    I:maximumPageSize=128
}


