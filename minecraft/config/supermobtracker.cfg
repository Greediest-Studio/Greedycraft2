# Configuration file

client {
    # Range in blocks to detect tracked mobs for the x-ray or glow highlight effect.
    # Min: 8.0
    # Max: 256.0
    D:detectionRange=64.0

    # Number of simulated kills for calculating drop rates.
    # Min: 100
    # Max: 100000
    I:dropSimulationCount=10000

    # Enable tracking of mobs. Requires a Minecraft restart.
    B:enableTracking=true

    # Last filter text in the mob tracker GUI.
    S:filterText=

    # Entity IDs that should be hidden from the mob tracker GUI and loot dumps. Supports partial IDs (e.g., "minecraft:" or "zomb").
    S:guiAndLootExcludedEntities <
     >

    # Whether to show the tracking overlay on screen.
    B:hudEnabled=true

    # Spacing between lines in the tracking overlay.
    # Min: 0
    # Max: 20
    I:hudLineSpacing=2

    # Padding from screen edge for the tracking overlay.
    # Min: 0
    # Max: 100
    I:hudPaddingExternal=4

    # Padding inside the tracking overlay box.
    # Min: 0
    # Max: 50
    I:hudPaddingInternal=2

    # Position of the tracking overlay on screen.
    S:hudPosition=TOP_LEFT

    # Use localized names in the tracker GUI.
    B:i18nNames=true

    # Number of loot rows shown per page in the JEI mob loot view. Requires restarting Minecraft to resize JEI recipes.
    # Min: 1
    # Max: 14
    I:jeiMobLootRows=7

    # Last selected entity in the mob tracker GUI.
    S:lastSelectedEntity=

    # List of entity IDs that are blacklisted from tracking.
    S:mobBlacklist <
     >

    # List of entity IDs that are whitelisted for tracking. The whitelist takes precedence over the blacklist.
    S:mobWhitelist <
     >

    # Entity IDs that crash or spam errors when rendered. These entities will not render at all in the preview or gallery.
    S:shouldRenderEntities <
        extrabotany:gaiaiii
     >

    # Maximum retries for spawn condition checks. Higher values handle random spawn conditions better but increase analysis time.
    # Min: 1
    # Max: 10000
    I:spawnCheckRetries=100

    # List of entity IDs currently being tracked.
    S:trackedEntityIds <
     >

    # Entity IDs that corrupt global state during drop simulation and should be excluded from simulation.
    # These entities can be identified by severe performance degradation for every entity after simulating their drops.
    S:unstableSimulationEntities <
        minecraft:ender_dragon
        draconicevolution:chaosguardian
     >

    # Render tracked mobs through walls with their normal model instead of using the vanilla glow outline.
    B:useModelXRay=true
}


