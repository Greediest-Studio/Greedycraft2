# Configuration file

general {
    # Amount of advancements processed per tick when syncing a new team member
    # Min: 1
    # Max: 2147483647
    I:advancementJoinSyncPerTick=25

    # If enabled, players in the same team will sync the advancements
    B:advancementSync=true

    # Advancement IDs (exact match like 'botania:challenge/odin_ring', or prefix match ending with '*' like 'botania:challenge/*') that will never be synced between team members.
    # Defaults exclude Botania's 6 Dice of Fate relic advancements so each player in a team can roll their own full relic pool.
    S:advancementSyncBlacklist <
        botania:challenge/infinite_fruit
        botania:challenge/king_key
        botania:challenge/flugel_eye
        botania:challenge/thor_ring
        botania:challenge/odin_ring
        botania:challenge/loki_ring
     >

    # If enabled, players in the same team will sync the gamestages
    B:gamestagesSync=true

    # If enabled, players in the same team will sync the levels from Reskillable
    B:reskillableLevelUpSync=true

    # If enabled, players in the same team will sync the unlockables from Reskillable
    B:reskillableUnlockableSync=true

    # Amount of seconds the syncing will be delayed on world join
    # Min: 0
    # Max: 2147483647
    I:syncDataSecondsDelay=20
}


