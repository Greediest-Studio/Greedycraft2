# Configuration file

detection {
    # Learn and save nickname aliases from EssentialsX /realname responses.
    # The expected response format is: nickname is profileName
    B:detectNameAliases=true

    # Try to identify players in system messages such as join and leave messages.
    B:handleSystemMessages=true

    # Manual nickname mappings in the form nickname=profileName.
    # Invalid entries are ignored and reported in the log.
    S:nameAliases <
     >

    # STRICT trusts structured click commands only.
    # HEURISTIC additionally scans messages for online player names, display names and aliases.
    # Valid values:
    # STRICT
    # HEURISTIC
    S:senderDetection=HEURISTIC
}


general {
    # Draw a small shadow behind player heads.
    B:drawShadow=true

    # Master switch for chat head rendering and text offsets.
    B:enabled=true

    # Align messages without a detected player with player messages in BEFORE_LINE mode.
    B:offsetNonPlayerText=true

    # BEFORE_NAME places the head immediately before the detected sender name.
    # BEFORE_LINE places the head in a fixed column before the whole chat line.
    # Valid values:
    # BEFORE_LINE
    # BEFORE_NAME
    S:renderPosition=BEFORE_NAME

    # Scales the hat layer outwards to create a subtle 3D effect.
    # Min: 0.0
    # Max: 1.0
    D:threeDeeNess=0.0
}


