# Configuration file

general {
    # 总开关：是否启用所有控制器 GUI 替换 / Master switch for all controller GUI replacements.
    B:enabled=true

    # Nova Engineering Core 兼容模式：手动开启后预热并固定 MMCE GUI 样式缓存，避免首次打开 GUI 时扫描机器 JSON / NovaEngineering-Core compatibility mode: manually enable to preload and pin MMCE GUI style cache, avoiding machine JSON scans on first GUI open.
    B:novaEngCoreCompatibilityMode=false

    # 信息区鼠标滚轮步长（像素） / Mouse wheel scroll step in pixels for info panels.
    # Min: 2
    # Max: 64
    I:wheelStep=10

    ##########################################################################################################
    # machinecontroller
    #--------------------------------------------------------------------------------------------------------#
    # 普通机器控制器 GUI 设置 / Settings for normal machine controller GUI.
    ##########################################################################################################

    machinecontroller {
        # Allow requested GUI size to exceed the current screen. Disables the safety clamp that normally fits guiWidth/guiHeight into the Minecraft window.
        B:allowOffscreenGui=false

        # 9 宫格使用的角尺寸 / Corner size used by 9-slice rendering.
        # Min: 2
        # Max: 128
        I:backgroundCorner=8

        # 自定义背景贴图资源路径，留空表示无 / Custom background texture resource location. Empty means none.
        S:backgroundTexture=

        # 9 宫格背景源贴图高度 / Background texture source height for 9-slice rendering.
        # Min: 16
        # Max: 4096
        I:backgroundTextureHeight=213

        # Custom texture origin offset X. Positive value lets texture extend to the left of GUI origin.
        # Min: 0
        # Max: 1024
        I:backgroundTextureOffsetX=0

        # Custom texture origin offset Y. Positive value lets texture extend above GUI origin.
        # Min: 0
        # Max: 1024
        I:backgroundTextureOffsetY=0

        # 9 宫格背景源贴图宽度 / Background texture source width for 9-slice rendering.
        # Min: 16
        # Max: 4096
        I:backgroundTextureWidth=176

        # 仅自定义贴图模式使用的分区，格式：id,x,y,width,height / Panels for custom-texture mode only. Format: id,x,y,width,height
        S:customPanels <
            main,182,10,140,112
         >

        # 未写 [panel:id] 前缀时的默认信息区 ID / Default panel id for text without [panel:id] prefix.
        S:defaultPanelId=main

        # Enable Smart Interface editor in controller GUI.
        B:enableSmartInterfaceEditor=true

        # GUI 高度，最小 213 / GUI height, minimum 213.
        # Min: 213
        # Max: 1024
        I:guiHeight=213

        # GUI 宽度，最小 176 / GUI width, minimum 176.
        # Min: 176
        # Max: 1024
        I:guiWidth=320

        # 未提供自定义贴图时是否隐藏 MMCE 默认背景 / Hide MMCE default background when no custom texture is provided.
        B:hideDefaultBackground=false

        # 是否隐藏底部玩家背包栏 / Hide the player inventory bar at the bottom.
        B:hidePlayerInventory=false

        # 信息区高度 / Info panel height.
        # Min: 24
        # Max: 1024
        I:panelHeight=112

        # 信息区宽度，0 表示按 GUI 宽度自动计算 / Info panel width, 0 means auto by GUI width.
        # Min: 0
        # Max: 1024
        I:panelWidth=0

        # 信息区 X 偏移，0 表示自动布局 / Info panel X offset, 0 means auto layout.
        # Min: 0
        # Max: 1024
        I:panelX=0

        # 信息区 Y 偏移 / Info panel Y offset.
        # Min: 0
        # Max: 1024
        I:panelY=10

        # 是否将普通控制器 GUI 替换为可扩展版本 / Replace normal controller GUI with resizable version.
        B:replaceGui=true

        # 是否显示蓝图信息 / Show blueprint information.
        B:showBlueprintInfo=true

        # 是否显示并行数信息 / Show parallelism information.
        B:showParallelismInfo=true

        # 是否显示性能信息，例如 Avg/Search/WorkMode / Show performance information, such as Avg/Search/WorkMode.
        B:showPerformanceInfo=true

        # 是否显示控制器状态信息 / Show controller status information.
        B:showStatusInfo=true

        # 是否显示已找到结构信息 / Show found structure information.
        B:showStructureInfo=true

        # Smart Interface editor input width.
        # Min: 4
        # Max: 512
        I:smartInterfaceEditorInputWidth=68

        # Virtual Smart Interface key when no DataPort is bound. Empty = disabled.
        S:smartInterfaceEditorVirtualKey=

        # Smart Interface editor X in GUI. -1 = auto place at right-bottom.
        # Min: -1
        # Max: 2048
        I:smartInterfaceEditorX=-1

        # Smart Interface editor Y in GUI. -1 = auto place at right-bottom.
        # Min: -1
        # Max: 2048
        I:smartInterfaceEditorY=-1

        # 是否使用 9 宫格渲染避免拉伸变形 / Use 9-slice rendering to avoid stretch distortion.
        B:useNineSlice=true
    }

    ##########################################################################################################
    # factorycontroller
    #--------------------------------------------------------------------------------------------------------#
    # 集成（工厂）控制器 GUI 设置 / Settings for integrated(factory) controller GUI.
    ##########################################################################################################

    factorycontroller {
        # Allow requested GUI size to exceed the current screen. Disables the safety clamp that normally fits guiWidth/guiHeight into the Minecraft window.
        B:allowOffscreenGui=false

        # 9 宫格使用的角尺寸 / Corner size used by 9-slice rendering.
        # Min: 2
        # Max: 128
        I:backgroundCorner=8

        # 自定义背景贴图资源路径，留空表示无 / Custom background texture resource location. Empty means none.
        S:backgroundTexture=mmcege:textures/guifactory.png

        # 9 宫格背景源贴图高度 / Background texture source height for 9-slice rendering.
        # Min: 16
        # Max: 4096
        I:backgroundTextureHeight=213

        # Custom texture origin offset X. Positive value lets texture extend to the left of GUI origin.
        # Min: 0
        # Max: 1024
        I:backgroundTextureOffsetX=0

        # Custom texture origin offset Y. Positive value lets texture extend above GUI origin.
        # Min: 0
        # Max: 1024
        I:backgroundTextureOffsetY=0

        # 9 宫格背景源贴图宽度 / Background texture source width for 9-slice rendering.
        # Min: 16
        # Max: 4096
        I:backgroundTextureWidth=280

        # 仅自定义贴图模式使用的分区，格式：id,x,y,width,height / Panels for custom-texture mode only. Format: id,x,y,width,height
        S:customPanels <
            main,113,10,159,112
         >

        # 未写 [panel:id] 前缀时的默认信息区 ID / Default panel id for text without [panel:id] prefix.
        S:defaultPanelId=main

        # Enable Smart Interface editor in factory GUI.
        B:enableSmartInterfaceEditor=false

        # GUI 高度，最小 213 / GUI height, minimum 213.
        # Min: 213
        # Max: 1024
        I:guiHeight=213

        # GUI 宽度，最小 280 / GUI width, minimum 280.
        # Min: 280
        # Max: 1024
        I:guiWidth=280

        # 未提供自定义贴图时是否隐藏 MMCE 默认背景 / Hide MMCE default background when no custom texture is provided.
        B:hideDefaultBackground=false

        # 是否隐藏底部玩家背包栏 / Hide the player inventory bar at the bottom.
        B:hidePlayerInventory=false

        # 信息区高度 / Info panel height.
        # Min: 24
        # Max: 1024
        I:panelHeight=112

        # 信息区宽度，0 表示按 GUI 宽度自动计算 / Info panel width, 0 means auto by GUI width.
        # Min: 0
        # Max: 1024
        I:panelWidth=0

        # 信息区 X 偏移，0 表示使用 MMCE 默认值（113） / Info panel X offset, 0 means MMCE default (113).
        # Min: 0
        # Max: 1024
        I:panelX=0

        # 信息区 Y 偏移 / Info panel Y offset.
        # Min: 0
        # Max: 1024
        I:panelY=10

        # Visible recipe queue rows on the left panel.
        # Min: 1
        # Max: 20
        I:queueVisibleRows=6

        # 是否将集成（工厂）控制器 GUI 替换为可扩展版本 / Replace integrated(factory) controller GUI with resizable version.
        B:replaceGui=true

        # 是否显示蓝图信息 / Show blueprint information.
        B:showBlueprintInfo=true

        # 是否显示并行数/线程信息 / Show parallelism/thread information.
        B:showParallelismInfo=true

        # 是否显示性能信息，例如 Avg/Search/WorkMode / Show performance information, such as Avg/Search/WorkMode.
        B:showPerformanceInfo=true

        # 是否显示控制器状态信息 / Show controller status information.
        B:showStatusInfo=true

        # 是否显示已找到结构信息 / Show found structure information.
        B:showStructureInfo=true

        # Smart Interface editor input width.
        # Min: 4
        # Max: 512
        I:smartInterfaceEditorInputWidth=68

        # Virtual Smart Interface key when no DataPort is bound. Empty = disabled.
        S:smartInterfaceEditorVirtualKey=

        # Smart Interface editor X in GUI. -1 = auto place at right-bottom.
        # Min: -1
        # Max: 2048
        I:smartInterfaceEditorX=-1

        # Smart Interface editor Y in GUI. -1 = auto place at right-bottom.
        # Min: -1
        # Max: 2048
        I:smartInterfaceEditorY=-1

        # Special/core thread background tint color. Hex RGB or ARGB, e.g. B2E5FF or FFB2E5FF.
        S:specialThreadBackgroundColor=B2E5FF

        # 线程队列左上角 X / Thread queue top-left X.
        # Min: 0
        # Max: 2048
        I:threadQueueX=8

        # 线程队列左上角 Y / Thread queue top-left Y.
        # Min: 0
        # Max: 2048
        I:threadQueueY=8

        # 线程队列每行高度 / Thread queue row height.
        # Min: 16
        # Max: 2048
        I:threadRowHeight=32

        # 线程队列每行宽度 / Thread queue row width.
        # Min: 24
        # Max: 2048
        I:threadRowWidth=86

        # 线程队列滚动条左侧 X，可为负数用于偏移 / Thread queue scrollbar X, negative values allowed for offsets.
        # Min: -2048
        # Max: 2048
        I:threadScrollbarX=94

        # 线程队列滚动条顶部 Y，可为负数用于偏移 / Thread queue scrollbar Y, negative values allowed for offsets.
        # Min: -2048
        # Max: 2048
        I:threadScrollbarY=8

        # 是否使用 9 宫格渲染避免拉伸变形 / Use 9-slice rendering to avoid stretch distortion.
        B:useNineSlice=true

        ##########################################################################################################
        # threadscrollbar
        #--------------------------------------------------------------------------------------------------------#
        # Custom factory thread scrollbar. New JSON styles should use factoryController.threadScrollbar.
        ##########################################################################################################

        threadscrollbar {
            # Scrollbar height. -1 = auto by visible thread rows.
            # Min: -1
            # Max: 2048
            I:height=-1

            # Track texture source height.
            # Min: 1
            # Max: 4096
            I:textureHeight=16

            # Track texture source width.
            # Min: 1
            # Max: 4096
            I:textureWidth=12

            # Thumb color fallback. Hex RGB/ARGB.
            S:thumbColor=FFFFFFFF

            # Minimum drawn thumb height.
            # Min: 1
            # Max: 512
            I:thumbMinHeight=15

            # Thumb texture. Empty = colored rectangle fallback.
            S:thumbTexture=

            # Thumb texture source height.
            # Min: 1
            # Max: 4096
            I:thumbTextureHeight=15

            # Thumb texture source width.
            # Min: 1
            # Max: 4096
            I:thumbTextureWidth=12

            # Track color fallback. Hex RGB/ARGB.
            S:trackColor=66000000

            # Track texture. Empty = colored rectangle fallback.
            S:trackTexture=

            # Whether to draw the factory thread scrollbar.
            B:visible=true

            # Scrollbar width.
            # Min: 1
            # Max: 128
            I:width=12

            # Scrollbar X. -1 = use legacy threadScrollbarX; other negative values are valid offsets.
            # Min: -2048
            # Max: 2048
            I:x=-1

            # Scrollbar Y. -1 = use legacy threadScrollbarY; other negative values are valid offsets.
            # Min: -2048
            # Max: 2048
            I:y=-1
        }

    }

