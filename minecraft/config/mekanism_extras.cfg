# Configuration file

world {
    # Enable naquadah ore generation in the end.
    B:enableEndNaquadahOre=false

    # Enable naquadah ore generation in the overworld.
    B:enableNaquadahOre=false

    # Maximum Y level for End naquadah veins.
    I:endNaquadahMaxHeight=30

    # Minimum Y level for End naquadah veins.
    I:endNaquadahMinHeight=10

    # Maximum number of blocks in an End naquadah vein.
    I:endNaquadahVeinSize=6

    # Number of naquadah veins generated per End chunk.
    I:endNaquadahVeinsPerChunk=24

    # Maximum Y level for small naquadah veins.
    I:naquadahSmallMaxHeight=4

    # Minimum Y level for small naquadah veins. The upstream mod uses the bottom bedrock range.
    I:naquadahSmallMinHeight=1

    # Maximum number of blocks in a small naquadah vein.
    I:naquadahSmallVeinSize=4

    # Number of small naquadah veins generated per overworld chunk.
    I:naquadahSmallVeinsPerChunk=8
}


