# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Not To Remove remap rules.
# Rules are ordered. Put the preferred replacement at the top of each list.
# This file is not automatically reordered or modified beyond saving edited values.
##########################################################################################################

general {
    # Stop the world from loading when a missing block, item, or biome matches one of the rules above
    # but no safe replacement can be applied.
    # Keep this enabled to avoid Forge removing the missing entry or remapping it to the wrong id.
    # Disable only if you prefer Forge's normal missing-mapping prompt and have a backup.
    B:failOnUnsafeRemap=false

    # Remap missing blocks, items, and biomes by changing only their mod id.
    # Format: oldmodid^newmodid
    # Example: aaa^bbb remaps missing aaa:name to bbb:name when bbb:name exists in the same registry.
    # The list is ordered. You may write multiple entries with the same old mod id,
    # such as aaa^bbb and aaa^ccc; the first existing target wins.
    # Put the preferred replacement at the top of this list.
    S:sameNameModIdRemaps <
        gct_ores^gct_additions
        gct_aby^gct_additions
        gct_bases^gct_additions
        gct_mobs^gct_additions
        gct_mac^gct_additions
     >

    # Remap specific missing blocks, items, and biomes to a specific new registry name.
    # Format: oldmodid:oldname^newmodid:newname
    # Example: aaa:old_block^bbb:new_block remaps aaa:old_block to bbb:new_block when it exists in the same registry.
    # The list is ordered. Multiple entries may use the same old registry name;
    # the first existing target wins, and missing targets fall through to the next entry.
    # Specific remaps are checked before same-name mod id remaps.
    # Put the preferred replacement at the top of this list.
    S:specificRegistryNameRemaps <
     >
}


