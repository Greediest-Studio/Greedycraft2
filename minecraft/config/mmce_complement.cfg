    ##########################################################################################################
    # liquid_energizer_hatch
    #--------------------------------------------------------------------------------------------------------#
    # Liquid Energizer Hatch settings.
    ##########################################################################################################

    liquid_energizer_hatch {
        # Accepted fluid conversion entries in the form fluid_registry_name=energy_per_mB.
        # Examples: pack:liquid_energy=1000000 or lava=2000.
        # Only positive integer ratios up to 9223372036854775807 are accepted.
        # The default list is empty so no ordinary fluid becomes free energy unexpectedly.
        S:fluid_energy_ratios <
            flux=1000000000
         >

        tiny {
            # Long-backed internal energy capacity. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:energy_capacity=100000000000

            # Long-backed fluid capacity in mB. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:fluid_capacity=100
        }

        small {
            # Long-backed internal energy capacity. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:energy_capacity=400000000000

            # Long-backed fluid capacity in mB. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:fluid_capacity=400
        }

        normal {
            # Long-backed internal energy capacity. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:energy_capacity=1600000000000

            # Long-backed fluid capacity in mB. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:fluid_capacity=1600
        }

        reinforced {
            # Long-backed internal energy capacity. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:energy_capacity=6400000000000

            # Long-backed fluid capacity in mB. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:fluid_capacity=6400
        }

        big {
            # Long-backed internal energy capacity. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:energy_capacity=25600000000000

            # Long-backed fluid capacity in mB. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:fluid_capacity=25600
        }

        huge {
            # Long-backed internal energy capacity. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:energy_capacity=102400000000000

            # Long-backed fluid capacity in mB. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:fluid_capacity=102400
        }

        ludicrous {
            # Long-backed internal energy capacity. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:energy_capacity=409600000000000

            # Long-backed fluid capacity in mB. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:fluid_capacity=409600
        }

        vacuum {
            # Long-backed internal energy capacity. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:energy_capacity=1638400000000000

            # Long-backed fluid capacity in mB. Stored as text because Forge 1.12 configs
            # cannot represent exact long integers. Range: 1 to 9223372036854775807.
            S:fluid_capacity=1638400
        }

    }

