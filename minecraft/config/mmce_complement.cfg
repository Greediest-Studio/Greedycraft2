        # Energy-consumption multiplier supplied by a MK V Overclock Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk5_energy_multiplier=1024.0

        # Recipe-duration multiplier supplied by a MK VI Overclock Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk6_duration_multiplier=0.015625

        # Energy-consumption multiplier supplied by a MK VI Overclock Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk6_energy_multiplier=4096.0
    }

    ##########################################################################################################
    # data_input_assembly
    #--------------------------------------------------------------------------------------------------------#
    # Fluid capacity settings for Data Input Assemblies.
    ##########################################################################################################

    data_input_assembly {
        # Per-tank fluid capacity of the Big Data Input Assembly (mB).
        # Min: 1
        # Max: 2000000000
        I:big_capacity=64000

        # Per-tank fluid capacity of the Huge Data Input Assembly (mB).
        # Min: 1
        # Max: 2000000000
        I:huge_capacity=512000

        # Per-tank fluid capacity of the Super Data Input Assembly (mB).
        # Min: 1
        # Max: 2000000000
        I:ludicrous_capacity=4096000

        # Per-tank fluid capacity of the Normal Data Input Assembly (mB).
        # Min: 1
        # Max: 2000000000
        I:normal_capacity=8000

        # Per-tank fluid capacity of the Small Data Input Assembly (mB).
        # Min: 1
        # Max: 2000000000
        I:small_capacity=1000
    }

    ##########################################################################################################
    # input_assembly
    #--------------------------------------------------------------------------------------------------------#
    # Fluid capacity settings for Input Assemblies.
    ##########################################################################################################

    input_assembly {
