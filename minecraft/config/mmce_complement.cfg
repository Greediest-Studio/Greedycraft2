# Configuration file

general {

    ##########################################################################################################
    # thread_hatch
    #--------------------------------------------------------------------------------------------------------#
    # Thread Hatch settings.
    ##########################################################################################################

    thread_hatch {
        # If true, every Thread Hatch in a formed machine multiplies the effects of the others.
        # If false, only one hatch of the highest installed tier takes effect.
        B:allow_stacking=false

        # Base normal-thread multiplier supplied by a MK I Thread Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk1_multiplier=2.0

        # Base normal-thread multiplier supplied by a MK II Thread Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk2_multiplier=3.0

        # Base normal-thread multiplier supplied by a MK III Thread Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk3_multiplier=5.0

        # Base normal-thread multiplier supplied by a MK IV Thread Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk4_multiplier=8.0

        # Base normal-thread multiplier supplied by a MK V Thread Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk5_multiplier=12.0

        # Base normal-thread multiplier supplied by a MK VI Thread Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk6_multiplier=16.0
    }

