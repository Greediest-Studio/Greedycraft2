        B:allow_stacking=false

        # Recipe-duration multiplier supplied by a MK I Overclock Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk1_duration_multiplier=0.5

        # Energy-consumption multiplier supplied by a MK I Overclock Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk1_energy_multiplier=4.0

        # Recipe-duration multiplier supplied by a MK II Overclock Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk2_duration_multiplier=0.25

        # Energy-consumption multiplier supplied by a MK II Overclock Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk2_energy_multiplier=16.0

        # Recipe-duration multiplier supplied by a MK III Overclock Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk3_duration_multiplier=0.125

        # Energy-consumption multiplier supplied by a MK III Overclock Hatch.
        # Min: 0.0
        # Max: 1000000.0
        D:mk3_energy_multiplier=64.0

        # Recipe-duration multiplier supplied by a MK IV Overclock Hatch.
