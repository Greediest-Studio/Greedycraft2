# Configuration file

general {
    # Enable growth accelerators triggering random ticks on adjacent blocks [default: true]
    B:enableGrowthAccelerator=true

    # Enable budding certus quartz blocks generating in meteorites [default: true]
    B:enableMeteoriteBudding=true

    # Enable annihilation plane producing meteorite dust at world height limit [default: true]
    B:enableMeteoriteDust=true

    # Number of ticks between two growth accelerator random ticks [range: 1 ~ 100, default: 10]
    I:growthAcceleratorSpeed=10

    # Interval in seconds for an upward-facing annihilation plane at world height limit to produce meteorite dust [range: 1 ~ 3600, default: 10]
    I:meteoriteDustIntervalSeconds=10
}


