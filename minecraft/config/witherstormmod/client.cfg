# Configuration file

general {
    # 是否启用愚人节粉色风暴和心形粒子效果。
    B:aprilFools=true

    # 是否在线程池构建 VBO 的纯 CPU 顶点数据；OpenGL 上传、绘制和删除始终留在渲染线程。
    B:asyncBufferBuilders=true

    # 是否启用白屏覆盖效果。
    B:blindingEffects=true

    # 是否渲染方块质量簇；强制渲染的剧情质量簇不受此选项影响。
    B:blockClusterRendering=true

    # 是否启用相机震动效果。
    B:cameraShakeEffects=true

    # 是否启用 Formidibomb 爆炸后的色差后处理。
    B:chromaticAberration=false
    B:customPanorama=false

    # 是否完全禁用 Minecraft 原版雾，包括普通、Boss、失明、水下与岩浆雾。
    B:disableVanillaFog=false

    # 远距离渲染凋零风暴时是否对牵引光束应用雾化。
    B:distantFog=true

    # 是否允许凋零风暴超出原版实体渲染距离后仍被渲染。
    B:distantRenderer=true

    # 是否启用耳鸣音效（Formidibomb 爆炸的响亮音效）。
    B:earRingingEffects=true

    # Hide debris rings until the Wither Storm reaches phase 6.
    B:hideDebrisRingsUntilSplit=false

    # 第 4 阶段及以上的风暴模型是否使用更大的方块（低分辨率）。
    B:lowResModels=false

    # 进入世界时是否提示 OptiFine 兼容性警告。
    B:optifineWarning=false

    # 是否显示赞助者彩蛋外观（nonamecrackers2 命名的共生体）。
    B:patronCosmetic=true

    # 是否允许原版 Minecraft 音乐播放。
    B:playMinecraftMusic=true

    # 是否播放凋零共生体的 Boss 主题音乐。
    B:playSymbiontTheme=false

    # 是否播放凋零风暴和肠道命令方块的 Boss 主题音乐。
    B:playWitherStormTheme=false

    # Render the rotating debris clusters surrounding the Wither Storm.
    B:renderDebrisCloud=true

    # Render the broad translucent debris rings surrounding large Wither Storm phases.
    B:renderDebrisRings=true

    # 远距离渲染凋零风暴时是否仍渲染碎片云。
    B:renderDistantDebris=true

    # 是否渲染凋零风暴头部的发光眼睛与牙齿贴图。
    B:renderEmissiveDecalForHeads=true

    # 风暴被撕裂时是否渲染脉冲方块效果。
    B:renderPulse=true

    # Render the Wither Storm's distant night shine.
    B:renderShine=true

    # 风暴附近时是否渲染天空/云/雾的氛围配色。
    B:renderSkyAmbienceEffects=true

    # 玩家处于牵引光束中时是否渲染屏幕边缘覆盖层。
    B:renderTractorBeamOverlay=true

    # 是否渲染凋零风暴头部发出的牵引光束。
    B:renderTractorBeams=true

    # 是否渲染牵引光束内部粒子和远端撞击碎屑。
    B:tractorBeamParticles=true

    # 是否使用 VBO 缓存方块质量簇与风暴碎片云；主体模型由 1.12 ModelRenderer 显示列表缓存。
    B:vertexBufferRendering=true

    # 是否对感染凋零病的实体叠加病化覆盖层。
    B:witherSicknessLayer=true

    # 远距离渲染凋零风暴时是否改用低分辨率模型。
    B:witherStormLOD=false
}


