# Configuration file

general {
    # 是否禁止 HammerLib 启动时联网拉取链接仓库
    # 关闭后不再请求 pastebin/gist/zeith.org，避免无网络或类加载异常导致启动崩溃
    B:"Disable HammerLib Link Repository Fetch"=true

    # 是否优化 AE2 普通及无线合成终端的连续合成，包含多态合成兼容
    B:"Enable AE2 Crafting Recipe Cache"=true

    # 是否启用区块渲染优化
    B:"Enable Chunk Queue Resizing Mixin"=true

    # 是否禁用伤害粒子
    B:"Enable Damage Particle Mixin"=true

    # 是否禁用匠魂进化法杖右键的投射物属性
    B:"Enable Mixin"=true

    # 是否启用凋零战利品表
    B:"Enable Wither Loot Mixin"=true
}


