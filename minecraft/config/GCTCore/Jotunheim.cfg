# Configuration file

general {
    # Base XZ biome region scale in blocks. Island coherence adds 160 * islandScale blocks. Restart the world; only new chunks change.
    # Min: 256.0
    # Max: 4096.0
    D:biomeScale=640.0

    # Deep island tunnel width multiplier. Zero disables deep tunnel carving.
    # Min: 0.0
    # Max: 1.5
    D:caveAmount=1.0

    # Three-dimensional edge/surface erosion strength. Zero disables fine erosion.
    # Min: 0.0
    # Max: 1.6
    D:erosion=0.85

    # Maximum living giants within 64 horizontal blocks and 24 vertical blocks of a natural-spawn candidate. Does not restrict eggs, commands or spawners.
    # Min: 1
    # Max: 8
    I:giantLocalLimit=2

    # One in this many otherwise valid giant natural-spawn attempts succeeds. Lower values spawn more giants; independent of species weights.
    # Min: 1
    # Max: 128
    I:giantSpawnRoll=24

    # Natural surface relief multiplier. Cloud terrain reserves at least 18 blocks for future trees.
    # Min: 0.25
    # Max: 1.75
    D:heightVariation=1.0

    # Island occurrence and coverage multiplier. Restart the world; only new chunks change.
    # Min: 0.55
    # Max: 1.4
    D:islandDensity=1.0

    # Horizontal island size and spacing multiplier. Does not change layer height bands.
    # Min: 0.65
    # Max: 1.75
    D:islandScale=1.0

    # Island body and downward root thickness multiplier, bounded inside each height band. Does not raise island surfaces.
    # Min: 0.55
    # Max: 1.5
    D:thickness=1.0
}


