# Configuration file

search {
    # Horizontal search radius in blocks. [range: 16 ~ 30000, default: 4096]
    I:radius=4096

    # Soft budget; a mod call cannot be interrupted. [range: 0.1 ~ 20.0, default: 2.0]
    S:tickBudgetMillis=2.0

    # Active time only; queue time is excluded. [range: 1 ~ 600, default: 60]
    I:timeoutSeconds=60
}


simulation {
    # Maximum simultaneously retained temporary chunks. [range: 9 ~ 1024, default: 128]
    I:cachedChunks=128

    # Maximum terrain chunks generated by one query. [range: 9 ~ 8192, default: 512]
    I:generatedChunks=512

    # Stop further work after a single call exceeds this limit. [range: 1 ~ 10000, default: 50]
    I:slowCallMillis=50
}


